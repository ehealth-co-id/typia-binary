name: build-and-publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run only (no registry write)"
        type: boolean
        default: false
      package_version:
        description: "Version to publish. Leave empty on a v* tag to use the tag."
        type: string
        default: ""
  push:
    tags: ["v*"]

jobs:
  version:
    # Resolved once: the platform packages and the umbrella must carry the same version.
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - id: resolve
        run: |
          v="${VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || {
            echo "::error::no publishable version: pass package_version, or push a v* tag (got '$VERSION')"
            exit 1
          }
          echo "value=$v" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.package_version || github.ref_name }}

  platform:
    needs: version
    strategy:
      # 64-bit runners only, and each name has to appear in package.json typiaBinary
      # .platforms or scripts/build.ts refuses the build.
      # macos-latest is arm64, so the x64 leg has to name an Intel runner explicitly
      # (the successor is macos-26-intel).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN publishes to GitHub Packages in this repo only
    defaults:
      run:
        shell: bash
    env:
      BINARY_BUILD_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
      BINARY_BUILD_PACKAGE_NAME: ${{ vars.BINARY_BUILD_PACKAGE_NAME }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: it writes a *global* registry= into .npmrc, which would send
      # every unscoped dep below to npm.pkg.github.com. The committed .npmrc routes only
      # the @ehealth-co-id scope instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      # The compiled plugin itself: on an exact key hit the Go build is skipped entirely,
      # because build.ts's `--from` seed path copies this instead of running ttsc.
      #
      # No restore-keys, deliberately. A partial match would seed a plugin built for a
      # different typia/ttsc/typescript triple and then publish it under the new one. The
      # key already encodes the triple (package.json) and the pinned deps (lockfile).
      - uses: actions/cache@v4
        id: plugin
        with:
          path: ${{ github.workspace }}/.ttsc-plugin-cache
          key: ttsc-plugin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'package-lock.json') }}

      # Cold Go build. Do NOT set CGO_ENABLED: ttsc hashes `go env CGO_ENABLED` into the
      # cache key, so forcing 0 would make every consumer's default-1 key miss.
      #
      # A plugin-cache miss is the only path that compiles. Speed those up by also caching
      # ttsc's Go object accelerator (TTSC_GO_CACHE_DIR set to a dir outside dist/, which
      # build.ts deletes, and that dir cached) under
      # `if: steps.plugin.outputs.cache-hit != 'true'` — ~3 GB per leg against the 10 GB
      # repo budget, and worth it only if triple-bump compiles hurt.
      - name: build
        run: |
          if [ "$PLUGIN_CACHE_HIT" = "true" ]; then
            npm run build -- --from .ttsc-plugin-cache
          else
            npm run build
          fi
        env:
          PLUGIN_CACHE_HIT: ${{ steps.plugin.outputs.cache-hit }}

      # Missed, so we just compiled: keep it for the next publish of the same triple. On a
      # hit actions/cache skips the save, and this is the same bytes that were restored.
      - if: steps.plugin.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ttsc-plugin-cache
          cp -r dist/plugins .ttsc-plugin-cache/

      # One linux artifact has to serve glibc and musl alike; a dynamic binary would
      # quietly stop working on Alpine, so fail instead of publishing one.
      - if: runner.os == 'Linux'
        run: file dist/plugins/*/plugin | grep -q 'statically linked'

      - name: publish
        run: |
          test -s dist/build.json
          test -d dist/plugins
          # No --registry: the scope map in .npmrc picks npm.pkg.github.com.
          # No --provenance: attestations are npmjs-only. No --access: visibility comes
          # from the repository.
          npm publish ./dist $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}

  umbrella:
    # Needs the platform packages to exist on the registry first: the published umbrella
    # points at exactly these versions.
    needs: [version, platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN publishes to GitHub Packages in this repo only
    defaults:
      run:
        shell: bash
    env:
      UMBRELLA_BUILD_PACKAGE_VERSION: ${{ needs.version.outputs.value }}
      UMBRELLA_BUILD_PACKAGE_NAME: ${{ vars.UMBRELLA_BUILD_PACKAGE_NAME }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Metadata only — no Go toolchain, no compile.
      - run: npm ci --omit=dev

      - run: npm run umbrella

      - name: publish
        run: |
          test -s dist-umbrella/package.json
          npm publish ./dist-umbrella $DRY_RUN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PAT_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_CONFIG_TOKEN }}
