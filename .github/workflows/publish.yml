name: build-and-publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish --dry-run only (no registry write)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: publish
        run: |
          test -s dist/build.json
          test -d dist/plugins
          npm publish ./dist --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
